<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIDE-CoVE – Multiplier Event</title>
<style>
  :root{
    --navy:#0e2c50; --navy-2:#16406f; --orange:#d8551f; --beige:#e4cfb7;
    --gray:#5f6b78; --line:#e6e6e3; --bg:#f4f5f7; --card:#ffffff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    color:var(--navy); background:var(--bg);
    min-height:100vh; display:flex; flex-direction:column;
    line-height:1.5;
  }

  /* header with the three logos */
  header.top{
    background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:20px 32px; padding:22px 40px;
  }
  header.top img{ display:block; width:auto; }
  .logo-drs{ height:56px; }
  .logo-cove{ height:64px; }
  .logo-eu{ height:30px; }

  main{ flex:1; width:100%; max-width:980px; margin:0 auto; padding:52px 24px 40px; text-align:center; }

  .event{ font-size:1.9rem; font-weight:800; letter-spacing:.2px; }
  .sub{ color:var(--gray); font-size:1.05rem; margin-top:10px; }
  .ws{
    display:inline-block; margin-top:30px; background:var(--navy); color:#fff;
    font-weight:800; font-size:1.5rem; letter-spacing:1px;
    padding:12px 40px; border-radius:999px; box-shadow:0 6px 16px rgba(14,44,80,.20);
  }
  .wtitle{ margin-top:24px; font-size:1.5rem; font-weight:800; }
  .accent{ width:180px; height:5px; background:var(--orange); border-radius:3px; margin:26px auto 0; }

  .choose{ margin-top:46px; font-size:1.15rem; font-weight:600; color:var(--navy); }

  .cards{
    margin-top:26px; display:grid; gap:20px;
    grid-template-columns:repeat(3,1fr);
  }
  .card{
    position:relative; display:flex; flex-direction:column; align-items:flex-start;
    text-align:left; text-decoration:none; color:var(--navy);
    background:var(--card); border:2px solid var(--line); border-radius:18px;
    padding:26px 24px 24px; min-height:170px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px); border-color:var(--navy);
    box-shadow:0 12px 26px rgba(14,44,80,.16); outline:none;
  }
  .card-num{
    width:52px; height:52px; border-radius:14px; background:var(--beige);
    color:var(--navy); font-weight:800; font-size:1.6rem;
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .card:hover .card-num,.card:focus-visible .card-num{ background:var(--orange); color:#fff; }
  .card-title{ font-size:1.25rem; font-weight:800; }
  .card-arrow{
    position:absolute; right:22px; bottom:20px; font-size:1.5rem; color:var(--orange);
    transition:transform .15s ease;
  }
  .card:hover .card-arrow,.card:focus-visible .card-arrow{ transform:translateX(5px); }

  footer.bottom{
    background:var(--orange); color:#fff; text-align:center; font-weight:700;
    font-size:.95rem; letter-spacing:.3px; padding:16px 20px;
  }

  @media (max-width:820px){
    header.top{ justify-content:center; padding:18px 20px; gap:18px 26px; }
    .cards{ grid-template-columns:1fr; }
    .event{ font-size:1.55rem; }
    main{ padding:38px 18px 32px; }
  }
</style>
</head>
